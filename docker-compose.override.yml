services:
  mcp-server:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/mcp-server/src:/repo/apps/mcp-server/src
      - ./packages/instrumentation/src:/repo/packages/instrumentation/src

  agent:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/agent/src:/repo/apps/agent/src
      - ./packages/instrumentation/src:/repo/packages/instrumentation/src
