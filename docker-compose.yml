services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - phoenix_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '6006:6006'
      - '4317:4317'
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      - phoenix
    ports:
      - '${MCP_PORT:-3300}:3300'
    environment:
      MCP_PORT: 3300
      INTERVALS_API_KEY: ${INTERVALS_API_KEY}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-0}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3300/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      target: production
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      phoenix:
        condition: service_started
      mcp-server:
        condition: service_healthy
    ports:
      - '${AGENT_PORT:-8787}:8787'
    environment:
      AGENT_PORT: 8787
      MCP_SERVER_URL: http://mcp-server:3300/mcp
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:12b}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8787/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  phoenix_db:
